# rom.conf -- everything ROM-specific in this recipe, sourced by every script.
# The scripts themselves are the AICP recipe's (riza220201/itel_rs4_AICP), unchanged
# in what they check; only the values below differ per ROM. (Branch 16.0 of this repo; main
# holds the earlier crDroid recipe for the Android 13/14 trees.)

ROM_NAME="crDroid"
ROM_MANIFEST_URL="https://github.com/crdroidandroid/android.git"
ROM_MANIFEST_BRANCH="16.0"                  # LineageOS 23.2 base (default revision lineage-23.2)

# The product this ROM builds for the RS4, and its release config (build/make/core/build_id.mk:
# BUILD_ID=BP4A.251205.006 -> bp4a; crDroid's vendor/lineage/vars/aosp_target_release agrees).
ROM_PRODUCT="lineage_S666LN"
ROM_RELEASE="bp4a"

# Who must own build/make and build/soong in this checkout (verify-sync check 5):
# "<path>:<repo project name>" pairs, as `repo list` prints them.
ROM_OWNERS="build/make:crdroidandroid/android_build build/soong:crdroidandroid/android_build_soong"

# No ROM-specific entry point: rom-build.sh falls back to a plain
#   lunch ${ROM_PRODUCT}-${ROM_RELEASE}-<variant>

# NOT bacon. crDroid's bacon (vendor/lineage = android_vendor_crdroid, build/tasks/bacon.mk) MOVES the
# OTA package to $(LINEAGE_VERSION).zip and then rm -rf's the target-files intermediates -- the
# input release signing needs (the same trap the Android 13 recipe met). Two goals instead: crDroid's
# otapackage builds $(PRODUCT_OUT)/lineage_S666LN-ota.zip straight from the target-files DIRECTORY (only a
# .zip.list is written; the first signed build found no zip, 2026-11-17), and target-files-package writes
# the zip the signer reads. Neither runs crDroid's bacon rule.
ROM_GOAL="target-files-package otapackage"
ROM_ARTIFACT_GLOB="lineage_S666LN-ota.zip"
ROM_SIGNED_PREFIX="crDroid_S666LN"

# Host tools the tree shells out to at parse time.
ROM_HOST_TOOLS=""

# The Pixel 10 identity (device tree identity_pixel10.mk), opt-in for the lineage_ product.
export S666LN_IDENTITY=pixel10
